# Render Blueprint — one-click deploy of Bengal International University.
# In the Render dashboard: New → Blueprint → connect this repo.
#
# This provisions a Docker web service. Because Render's free tier has no managed
# MySQL, point DB_* at a free external MySQL (Aiven / Railway / PlanetScale) and
# set DB_SSL=true. After the first deploy, open a shell and run:
#   npm run init-db
services:
  - type: web
    name: biu-university
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SAMESITE
        value: lax
      - key: COOKIE_SECURE
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
